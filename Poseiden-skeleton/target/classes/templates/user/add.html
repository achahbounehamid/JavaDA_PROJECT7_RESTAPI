<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8"/>
	<title>Add User</title>
	<link rel="stylesheet" href="../../css/bootstrap.min.css">
</head>
<body>
<div class="container-fluid vh-100">
	<div class="row h-100">
		<div class="col-md-4 d-flex flex-column justify-content-center align-items-center bg-dark text-white">
			<h2 class="text-center">User Interface<br/>Functionality</h2>
			<p class="mt-3">User 7.1</p>
		</div>

		<div class="col-md-8 d-flex flex-column justify-content-start align-items-center position-relative p-4">
			<h3 class="mb-4 text-center">Add User Screen</h3>
			<div class="w-100" style="max-width: 500px;">
				<h4 class="mb-3">Add New User</h4>
				<form th:action="@{/user/validate}" th:object="${user}" method="post">
					<div class="mb-3">
						<label for="fullname" class="form-label">Full Name</label>
						<input type="text" th:field="*{fullname}" id="fullname" class="form-control" placeholder="Full Name">
						<p class="text-danger" th:if="${#fields.hasErrors('fullname')}" th:errors="*{fullname}"></p>
					</div>

					<div class="mb-3">
						<label for="username" class="form-label">User Name</label>
						<input type="text" th:field="*{username}" id="username" class="form-control" placeholder="User Name">
						<p class="text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
					</div>

					<div class="mb-3">
						<label for="password" class="form-label">Password</label>
						<input type="password" th:field="*{password}" id="password" class="form-control" placeholder="Password">
						<p class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
					</div>

					<div class="mb-4">
						<label class="form-label">Role</label><br>
						<div>
							<label class="form-check-label me-3">
								<input class="form-check-input" type="radio" th:field="*{role}" th:value="ADMIN"> Admin
							</label>
							<label class="form-check-label">
								<input class="form-check-input" type="radio" th:field="*{role}" th:value="USER"> User
							</label>
						</div>
						<p class="text-danger" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></p>
					</div>

					<div class="d-flex justify-content-start gap-2">
						<a class="btn btn-danger" href="/user/list">Cancel</a>
						<input class="btn btn-primary" type="submit" value="Add User">
					</div>
				</form>
			</div>

			<!-- Logo -->
			<div class="position-absolute bottom-0 end-0 m-3">
				<img src="/images/logo.png" alt="Poseidon Logo" style="height: 50px;">
			</div>
		</div>
	</div>
</div>
</body>
</html>
