<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8"/>
	<title>User List</title>
	<link rel="stylesheet" href="../../css/bootstrap.min.css">
</head>
<body>
<div class="container-fluid vh-100">
	<div class="row h-100">
		<!-- Sidebar gauche -->
		<div class="col-md-4 d-flex flex-column justify-content-center align-items-center bg-dark text-white">
			<h2 class="text-center">User Interface<br/>Functionality</h2>
			<p class="mt-3">User 7.3</p>
		</div>

		<!-- Partie droite -->
		<div class="col-md-8 d-flex flex-column p-4 position-relative">
			<div class="d-flex justify-content-between align-items-center mb-3">
				<div>
					<a href="/">Home</a>&nbsp;|&nbsp;
					<a href="/bidList/list">Bid List</a>&nbsp;|&nbsp;
					<a href="/curvePoint/list">Curve Points</a>&nbsp;|&nbsp;
					<a href="/trade/list">Trade</a>&nbsp;|&nbsp;
					<a href="/rule/list">Rule</a>&nbsp;|&nbsp;
					<a href="/user/list">User</a>
				</div>
				<div class="text-end">
					<a href="/">Home</a>&nbsp;|&nbsp;<a href="/login">Login</a>
				</div>
			</div>

			<h3 class="text-center mb-3">User List Screen</h3>
			<h4 class="mb-3">User List</h4>

			<a href="/user/add" class="btn btn-primary btn-sm mb-2 px-3 py-1">Add New</a>

			<table class="table table-bordered table-sm">
				<thead class="table-light">
				<tr>
					<th>Id</th>
					<th>Full Name</th>
					<th>User Name</th>
					<th>Role</th>
					<th>Action</th>
				</tr>
				</thead>
				<tbody>
				<tr th:each="user : ${users}">
					<td th:text="${user.id}"></td>
					<td th:text="${user.fullname}"></td>
					<td th:text="${user.username}"></td>
					<td th:text="${user.role}"></td>
					<td class="text-center">
						<a th:href="@{/user/update/{id}(id=${user.id})}">Edit</a> |
						<a th:href="@{/user/delete/{id}(id=${user.id})}">Delete</a>
					</td>
				</tr>
				</tbody>
			</table>

			<!-- Logo -->
			<div class="position-absolute bottom-0 end-0 m-3">
				<img src="/images/logo.png" alt="Poseidon Logo" style="height: 50px;">
			</div>
		</div>
	</div>
</div>
</body>
</html>
