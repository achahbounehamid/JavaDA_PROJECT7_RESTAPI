<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8"/>
	<title>Add Rating</title>
	<link rel="stylesheet" href="../../css/bootstrap.min.css">
</head>
<body>
<div class="container-fluid vh-100">
	<div class="row h-100">
		<!-- Partie gauche -->
		<div class="col-md-4 d-flex flex-column justify-content-center align-items-center bg-dark text-white">
			<h2 class="text-center">User Interface<br/>Functionality</h2>
			<p class="mt-3">Rating 4.1</p>
		</div>

		<!-- Partie droite -->
		<div class="col-md-8 d-flex flex-column justify-content-start align-items-center position-relative p-4">
			<h3 class="mb-4 text-center">Add Rating Screen</h3>
			<div class="w-100" style="max-width: 500px;">
				<h4 class="mb-3">Add New Rating</h4>
				<form th:action="@{/rating/validate}" th:object="${rating}" method="post">
					<div class="mb-3">
						<label for="moodysRating" class="form-label">Moodys Rating</label>
						<input type="text" th:field="*{moodysRating}" id="moodysRating" class="form-control" placeholder="Moodys Rating">
						<p class="text-danger" th:if="${#fields.hasErrors('moodysRating')}" th:errors="*{moodysRating}"></p>
					</div>

					<div class="mb-3">
						<label for="sandPRating" class="form-label">SandP Rating</label>
						<input type="text" th:field="*{sandPRating}" id="sandPRating" class="form-control" placeholder="SandP Rating">
						<p class="text-danger" th:if="${#fields.hasErrors('sandPRating')}" th:errors="*{sandPRating}"></p>
					</div>

					<div class="mb-3">
						<label for="fitchRating" class="form-label">Fitch Rating</label>
						<input type="text" th:field="*{fitchRating}" id="fitchRating" class="form-control" placeholder="Fitch Rating">
						<p class="text-danger" th:if="${#fields.hasErrors('fitchRating')}" th:errors="*{fitchRating}"></p>
					</div>

					<div class="mb-4">
						<label for="orderNumber" class="form-label">Order</label>
						<input type="number" th:field="*{orderNumber}" id="orderNumber" class="form-control" placeholder="Order Number">
						<p class="text-danger" th:if="${#fields.hasErrors('orderNumber')}" th:errors="*{orderNumber}"></p>
					</div>

					<div class="d-flex justify-content-start gap-2">
						<a class="btn btn-danger" href="/rating/list">Cancel</a>
						<input type="submit" class="btn btn-primary" value="Add Rating">
					</div>
				</form>
			</div>
		</div>
	</div>
</div>
</body>
</html>
