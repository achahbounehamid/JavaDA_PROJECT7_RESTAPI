<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Access Denied - 403</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css"/>
</head>
<body>
<div class="container text-center mt-5">
    <h2 class="text-danger mb-4">403 - Access Denied</h2>

    <p>You do not have permission to access this page.</p>


    <p class="mt-3">
        Connecté en tant que : <b th:text="${#httpServletRequest.remoteUser}">Utilisateur</b>
    </p>


    <form th:action="@{/app/logout}" method="POST" class="d-inline-block ms-2">
        <input type="submit" value="Logout" class="btn btn-outline-secondary btn-sm"/>
    </form>


    <div class="alert alert-danger mt-3" role="alert" th:text="${errorMsg}">
        Vous n'êtes pas autorisé à accéder à cette page.
    </div>


    <a href="/" class="btn btn-primary mt-3">Retour à l'accueil</a>
</div>
</body>
</html>
