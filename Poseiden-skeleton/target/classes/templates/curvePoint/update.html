<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8"/>
	<title>Update Curve Point</title>
	<link rel="stylesheet" href="../../css/bootstrap.min.css">
</head>
<body>
<div class="container-fluid vh-100">
	<div class="row h-100">
		<!-- Partie gauche -->
		<div class="col-md-4 d-flex flex-column justify-content-center align-items-center bg-dark text-white">
			<h2 class="text-center">User Interface<br/>Functionality</h2>
			<p class="mt-3">Curve 3.4</p>
		</div>

		<!-- Partie droite -->
		<div class="col-md-8 d-flex flex-column justify-content-start align-items-center position-relative p-4">
			<h3 class="mb-4 text-center">Update Curve Point Screen</h3>
			<div class="w-100" style="max-width: 500px;">
				<h4 class="mb-3">Update Curve Point</h4>
				<form th:action="@{/curvePoint/update/{id}(id=${curvePoint.id})}" th:object="${curvePoint}" method="post">
					<div class="mb-3">
						<label for="term" class="form-label">Term</label>
						<input type="text" th:field="*{term}" id="term" placeholder="Term" class="form-control">
						<p class="text-danger" th:if="${#fields.hasErrors('term')}" th:errors="*{term}"></p>
					</div>
					<div class="mb-4">
						<label for="value" class="form-label">Value</label>
						<input type="number" th:field="*{value}" id="value" placeholder="Value" class="form-control">
						<p class="text-danger" th:if="${#fields.hasErrors('value')}" th:errors="*{value}"></p>
					</div>

					<!-- Champ caché pour l'ID -->
					<input type="hidden" th:field="*{id}" />

					<div class="d-flex justify-content-start gap-2">
						<a class="btn btn-danger" href="/curvePoint/list">Cancel</a>
						<input class="btn btn-primary" type="submit" value="Update Curve Point">
					</div>
				</form>
			</div>

			<!-- Logo Poseidon -->
<!--			<div class="position-absolute bottom-0 end-0 m-3">-->
<!--				<img src="../../static/css/imag/logo.PNG" alt="Poseidon Logo" style="height: 60px;">-->
<!--			</div>-->
		</div>
	</div>
</div>
</body>
</html>
