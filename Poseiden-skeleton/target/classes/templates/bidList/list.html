<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8"/>
	<title>Bid List</title>
	<link rel="stylesheet" href="../../css/bootstrap.min.css">
</head>
<body>
<div class="container-fluid vh-100">
	<div class="row h-100">
		<!-- Sidebar gauche -->
		<div class="col-md-4 d-flex flex-column justify-content-center align-items-center bg-dark text-white">
			<h2 class="text-center">User Interface<br/>Functionality</h2>
			<p class="mt-3">Bid 2.3</p>
		</div>

		<!-- Contenu droit -->
		<div class="col-md-8 position-relative d-flex flex-column p-4">
			<!-- Header avec navigation -->
			<div class="d-flex justify-content-between align-items-center mb-3">
				<div>
					<a href="/">Home</a>&nbsp;|&nbsp;
					<a href="/bidList/list">Bid List</a>&nbsp;|&nbsp;
					<a href="/curvePoint/list">Curve Points</a>&nbsp;|&nbsp;
					<a href="/rating/list">Ratings</a>&nbsp;|&nbsp;
					<a href="/trade/list">Trade</a>&nbsp;|&nbsp;
					<a href="/rule/list">Rule</a>&nbsp;|&nbsp;
					<a href="/user/list">User</a>
				</div>
				<div class="text-end">
                    <span th:if="${username != null}">
                        Logged in user: <b th:text="${username}"></b>
                    </span>
					<form th:action="@{/app/logout}" method="POST" class="d-inline-block ms-2">
						<input type="submit" value="Logout" class="btn btn-outline-secondary btn-sm"/>
					</form>
				</div>
			</div>

			<!-- Titre et tableau -->
			<h3 class="text-center mb-3">Bid List</h3>
			<a href="/bidList/add" class="btn btn-primary btn-sm mb-2">Add New</a>

			<table class="table table-bordered table-sm">
				<thead class="table-light">
				<tr>
					<th>Id</th>
					<th>Account</th>
					<th>Type</th>
					<th>Bid Quantity</th>
					<th>Action</th>
				</tr>
				</thead>
				<tbody>
				<tr th:each="bidList : ${bidLists}">
					<td style="width: 10%" th:text="${bidList.bidListId}"></td>
					<td th:text="${bidList.account}"></td>
					<td th:text="${bidList.type}"></td>
					<td th:text="${bidList.bidQuantity}"></td>
					<td style="width: 15%" class="text-center">
						<a th:href="@{/bidList/update/{id}(id=${bidList.bidListId})}">Edit</a> |
						<a th:href="@{/bidList/delete/{id}(id=${bidList.bidListId})}">Delete</a>
					</td>
				</tr>
				</tbody>
			</table>

			<!-- Logo Poseidon -->
<!--			<div class="position-absolute bottom-0 end-0 m-3">-->
<!--				<img src="/images/logo.png" alt="Poseidon Logo" style="height: 50px;">-->
<!--			</div>-->
		</div>
	</div>
</div>
</body>
</html>
