<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8"/>
	<title>Trade List</title>
	<link rel="stylesheet" href="../../css/bootstrap.min.css">
</head>
<body>
<div class="container-fluid vh-100">
	<div class="row h-100">
		<!-- Partie gauche -->
		<div class="col-md-4 d-flex flex-column justify-content-center align-items-center bg-dark text-white">
			<h2 class="text-center">User Interface<br/>Functionality</h2>
			<p class="mt-3">Trade 5.3</p>
		</div>

		<!-- Partie droite -->
		<div class="col-md-8 d-flex flex-column p-4 position-relative">
			<!-- Navigation + utilisateur -->
			<div class="d-flex justify-content-between align-items-center mb-3">
				<div>
					<a href="/">Home</a>&nbsp;|&nbsp;
					<a href="/bidList/list">Bid List</a>&nbsp;|&nbsp;
					<a href="/curvePoint/list">Curve Points</a>&nbsp;|&nbsp;
					<a href="/rating/list">Ratings</a>&nbsp;|&nbsp;
					<a href="/trade/list">Trade</a>&nbsp;|&nbsp;
					<a href="/rule/list">Rule</a>&nbsp;|&nbsp;
					<a href="/user/list">User</a>
				</div>
				<div class="text-end">
                    <span th:if="${username != null}">
                        Logged in user: <b th:text="${username}"></b>
                    </span>
					<form th:action="@{/app-logout}" method="POST" class="d-inline-block ms-2">
						<input type="submit" value="Logout" class="btn btn-outline-secondary btn-sm"/>
					</form>
				</div>
			</div>

			<h3 class="text-center mb-3">Trade List Screen</h3>
			<h4 class="mb-3">Trade List</h4>

			<a href="/trade/add" class="btn btn-primary btn-sm mb-2 px-3 py-1">Add New</a>

			<table class="table table-bordered table-sm">
				<thead class="table-light">
				<tr>
					<th>Id</th>
					<th>Account</th>
					<th>Type</th>
					<th>Buy Quantity</th>
					<th>Action</th>
				</tr>
				</thead>
				<tbody>
				<tr th:each="trade : ${trades}">
					<td th:text="${trade.tradeId}"></td>
					<td th:text="${trade.account}"></td>
					<td th:text="${trade.type}"></td>
					<td th:text="${trade.buyQuantity}"></td>
					<td class="text-center">
						<a th:href="@{/trade/update/{id}(id=${trade.tradeId})}">Edit</a> |
						<a th:href="@{/trade/delete/{id}(id=${trade.tradeId})}">Delete</a>
					</td>
				</tr>
				</tbody>
			</table>

			<!-- Logo -->
			<div class="position-absolute bottom-0 end-0 m-3">
				<img src="/images/logo.png" alt="Poseidon Logo" style="height: 50px;">
			</div>
		</div>
	</div>
</div>
</body>
</html>
