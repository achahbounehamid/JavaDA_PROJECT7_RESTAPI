<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8"/>
	<title>Update Trade</title>
	<link rel="stylesheet" href="../../css/bootstrap.min.css">
</head>
<body>
<div class="container-fluid vh-100">
	<div class="row h-100">
		<div class="col-md-4 d-flex flex-column justify-content-center align-items-center bg-dark text-white">
			<h2 class="text-center">User Interface<br/>Functionality</h2>
			<p class="mt-3">Trade 5.2</p>
		</div>
		<div class="col-md-8 d-flex flex-column justify-content-start align-items-center position-relative p-4">
			<h3 class="mb-4 text-center">Update Trade Screen</h3>
			<div class="w-100" style="max-width: 500px;">
				<h4 class="mb-3">Update Trade</h4>
				<form th:action="@{/trade/update/{id}(id=${trade.tradeId})}" th:object="${trade}" method="post">
					<div class="mb-3">
						<label for="account" class="form-label">Account</label>
						<input type="text" th:field="*{account}" id="account" class="form-control" placeholder="Account">
						<p class="text-danger" th:if="${#fields.hasErrors('account')}" th:errors="*{account}"></p>
					</div>
					<div class="mb-3">
						<label for="type" class="form-label">Type</label>
						<input type="text" th:field="*{type}" id="type" class="form-control" placeholder="Type">
						<p class="text-danger" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></p>
					</div>
					<div class="mb-4">
						<label for="buyQuantity" class="form-label">Buy Quantity</label>
						<input type="number" th:field="*{buyQuantity}" id="buyQuantity" class="form-control" placeholder="Buy Quantity">
						<p class="text-danger" th:if="${#fields.hasErrors('buyQuantity')}" th:errors="*{buyQuantity}"></p>
					</div>

					<input type="hidden" th:field="*{tradeId}" />

					<div class="d-flex justify-content-start gap-2">
						<a class="btn btn-danger" href="/trade/list">Cancel</a>
						<input class="btn btn-primary" type="submit" value="Update Trade">
					</div>
				</form>
			</div>
		</div>
	</div>
</div>
</body>
</html>
