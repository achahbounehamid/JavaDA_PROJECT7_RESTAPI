<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8"/>
	<title>Add Rule</title>
	<link rel="stylesheet" href="../../css/bootstrap.min.css">
</head>
<body>
<div class="container-fluid vh-100">
	<div class="row h-100">
		<!-- Partie gauche -->
		<div class="col-md-4 d-flex flex-column justify-content-center align-items-center bg-dark text-white">
			<h2 class="text-center">User Interface<br/>Functionality</h2>
			<p class="mt-3">Rule 6.1</p>
		</div>

		<!-- Partie droite -->
		<div class="col-md-8 d-flex flex-column justify-content-start align-items-center position-relative p-4">
			<h3 class="mb-4 text-center">Add Rule Screen</h3>
			<div class="w-100" style="max-width: 600px;">
				<h4 class="mb-3">Add New Rule</h4>
				<form th:action="@{/rule/validate}" th:object="${rule}" method="post">
					<div class="mb-3">
						<label for="name" class="form-label">Name</label>
						<input type="text" th:field="*{name}" id="name" class="form-control" placeholder="Name">
						<p class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
					</div>

					<div class="mb-3">
						<label for="description" class="form-label">Description</label>
						<input type="text" th:field="*{description}" id="description" class="form-control" placeholder="Description">
						<p class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>
					</div>

					<div class="mb-3">
						<label for="json" class="form-label">Json</label>
						<input type="text" th:field="*{json}" id="json" class="form-control" placeholder="Json">
						<p class="text-danger" th:if="${#fields.hasErrors('json')}" th:errors="*{json}"></p>
					</div>

					<div class="mb-3">
						<label for="template" class="form-label">Template</label>
						<input type="text" th:field="*{template}" id="template" class="form-control" placeholder="Template">
						<p class="text-danger" th:if="${#fields.hasErrors('template')}" th:errors="*{template}"></p>
					</div>

					<div class="mb-3">
						<label for="sqlStr" class="form-label">SQL</label>
						<input type="text" th:field="*{sqlStr}" id="sqlStr" class="form-control" placeholder="SQL">
						<p class="text-danger" th:if="${#fields.hasErrors('sqlStr')}" th:errors="*{sqlStr}"></p>
					</div>

					<div class="mb-4">
						<label for="sqlPart" class="form-label">SQL Part</label>
						<input type="text" th:field="*{sqlPart}" id="sqlPart" class="form-control" placeholder="SQL Part">
						<p class="text-danger" th:if="${#fields.hasErrors('sqlPart')}" th:errors="*{sqlPart}"></p>
					</div>

					<div class="d-flex justify-content-start gap-2">
						<a class="btn btn-danger" href="/rule/list">Cancel</a>
						<input class="btn btn-primary" type="submit" value="Add Rule">
					</div>
				</form>
			</div>

			<!-- Logo -->
			<div class="position-absolute bottom-0 end-0 m-3">
				<img src="../../static/css/imag/logo.PNG" alt="Poseidon Logo" style="height: 60px;">
			</div>
		</div>
	</div>
</div>
</body>
</html>
