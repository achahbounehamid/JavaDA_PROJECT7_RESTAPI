<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container-fluid vh-100">
    <div class="row h-100">
        <!-- Left dark section -->
        <div class="col-md-4 d-flex flex-column justify-content-center align-items-center bg-dark text-white">
            <h2 class="text-center">User Interface<br>Functionality</h2>
            <p class="mt-3">Login 1.1</p>
        </div>

        <!-- Right form section -->
        <div class="col-md-8 d-flex flex-column justify-content-center align-items-center bg-white">
            <h3 class="mb-4">Login Screen</h3>
            <div style="min-width: 300px;">
                <h5 class="mb-3">Login with Username and Password</h5>
                <form th:action="@{/app/login}" method="post">
                    <div class="mb-3 row">
                        <label for="username" class="col-sm-4 col-form-label text-end">User:</label>
                        <div class="col-sm-8">
                            <input type="text" class="form-control" id="username" name="username" required />
                        </div>
                    </div>
                    <div class="mb-3 row">
                        <label for="password" class="col-sm-4 col-form-label text-end">Password:</label>
                        <div class="col-sm-8">
                            <input type="password" class="form-control" id="password" name="password" required />
                        </div>
                    </div>
                    <div class="d-flex justify-content-end">
                        <button type="submit" class="btn btn-secondary">Login</button>
                    </div>
                </form>
                <div th:if="${param.error}" class="mt-3 text-danger text-center">
                    Invalid username or password.
                </div>
                <div th:if="${param.logout}" class="mt-3 text-success text-center">
                    You have been logged out.
                </div>
            </div>

            <!-- Logo bottom right -->
            <div class="position-absolute bottom-0 end-0 m-3">
                <img src="../../static/css/imag/logo.PNG" alt="Poseidon Logo" style="height: 60px;">
            </div>
        </div>
    </div>
</div>
</body>
</html>
