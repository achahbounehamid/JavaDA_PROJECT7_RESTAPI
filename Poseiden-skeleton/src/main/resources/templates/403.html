<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Access Denied - 403</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css"/>
</head>
<body>
<div class="container text-center mt-5">
    <h2 class="text-danger mb-4">403 - Access Denied</h2>

    <p>You do not have permission to access this page.</p>

    <div class="mt-3">
        Logged in user: <b th:inline="text">[[${#httpServletRequest.remoteUser}]]</b>
        <form th:action="@{/app-logout}" method="POST" class="d-inline-block ms-2">
            <input type="submit" value="Logout" class="btn btn-outline-secondary btn-sm"/>
        </form>
    </div>

    <p class="mt-3 text-danger" th:text="${errorMsg}">You are not authorized to view this page.</p>
</div>
</body>
</html>
